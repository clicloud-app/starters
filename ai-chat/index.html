<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat</title>
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f4f4f1; color: #1b1b1f; display: flex; flex-direction: column; height: 100vh; }
    #log { flex: 1; overflow-y: auto; padding: 24px; max-width: 720px; width: 100%; margin: 0 auto; box-sizing: border-box; }
    .msg { margin: 0 0 12px; padding: 10px 14px; border-radius: 14px; max-width: 85%; white-space: pre-wrap; }
    .user { background: #1b1b1f; color: #fff; margin-left: auto; }
    .assistant { background: #fff; border: 1px solid #e3e1da; }
    form { display: flex; gap: 8px; padding: 16px; max-width: 720px; width: 100%; margin: 0 auto; box-sizing: border-box; }
    input { flex: 1; padding: 12px; border: 1px solid #d8d6cf; border-radius: 12px; font: inherit; }
    button { padding: 12px 18px; border: 0; border-radius: 12px; background: #2457ff; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <div id="log" aria-live="polite"><p class="msg assistant">Hi! Ask me anything.</p></div>
  <form id="f"><input id="q" autocomplete="off" placeholder="Type a message" aria-label="Message" /><button id="b">Send</button></form>
  <script>
    const log = document.getElementById("log"), f = document.getElementById("f"), q = document.getElementById("q"), b = document.getElementById("b");
    const messages = [];
    const add = (role, text) => { const p = document.createElement("p"); p.className = "msg " + role; p.textContent = text; log.appendChild(p); log.scrollTop = log.scrollHeight; };
    f.onsubmit = async (e) => {
      e.preventDefault();
      const text = q.value.trim(); if (!text) return;
      q.value = ""; add("user", text); messages.push({ role: "user", content: text }); b.disabled = true;
      try {
        const r = await fetch("/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ messages }) });
        const j = await r.json();
        const reply = j.reply ?? ("Error: " + (j.error ?? "no answer"));
        add("assistant", reply); if (j.reply) messages.push({ role: "assistant", content: j.reply });
      } catch { add("assistant", "Couldn't reach the server."); }
      b.disabled = false; q.focus();
    };
  </script>
</body>
</html>
